plugins {
    id 'com.android.application'
}
android {
    namespace 'com.versionsnatcher'
    compileSdk 34
    defaultConfig {
        applicationId 'com.versionsnatcher.app'
        minSdk 29
        targetSdk 33
        versionCode 1
        versionName '1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
