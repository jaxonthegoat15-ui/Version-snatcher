<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Version Snatcher</title>
<style>
:root{--bg:#000;--line:#1a1a1a;--tx:#d0d0d0;--mut:#666;--ac:#fff}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font:18px/1.5 system-ui,Segoe UI,sans-serif;min-height:100vh;padding:40px 20px}
main{max-width:860px;margin:auto}
h1{font-size:28px;font-weight:500;color:var(--ac);letter-spacing:.5px}
.sub{color:var(--mut);font-size:15px;margin:4px 0 32px}
.drop{display:block;border:1px solid var(--line);border-radius:12px;padding:48px 20px;text-align:center;cursor:pointer;transition:border-color .2s}
.drop:hover,.drop.on{border-color:#444}
.drop b{font-size:20px;font-weight:500;color:var(--ac)}.drop p{color:var(--mut);font-size:14px}
input[type=file]{display:none}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:1px;margin:28px 0;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.c{background:var(--bg);padding:14px 18px}
.c small{color:var(--mut);display:block;font-size:12px;text-transform:uppercase;letter-spacing:1px}
.c span{font-size:20px;word-break:break-all}
.c.hl span{color:var(--ac);font-weight:600}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 14px}
button{font:inherit;font-size:16px;color:var(--tx);background:transparent;border:1px solid var(--line);border-radius:10px;padding:10px 18px;cursor:pointer;transition:border-color .2s,color .2s}
button:hover{border-color:#555;color:var(--ac)}
button.p{background:var(--ac);color:#000;border-color:var(--ac);font-weight:600}
button.p:hover{background:#ccc;border-color:#ccc;color:#000}
button.chip.on{border-color:var(--ac);color:var(--ac)}
.row{display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--line);padding:10px 4px}
.row .n{flex:1;min-width:0;word-break:break-all;font-size:15px}
.row .s{color:var(--mut);font-size:13px;white-space:nowrap}
.tag{font-size:13px;color:var(--mut);width:44px}
.tag.d{color:var(--tx)}
#msg{color:var(--mut);font-size:15px;margin-top:14px;min-height:24px}
.err{color:#d66!important}
</style></head><body><main>
<h1>Version Snatcher</h1>
<p class="sub">Open a Quest game APK. Get its Unity editor version and pull the .so / .dll files for modding. Runs fully offline on your Quest.</p>
<label class="drop" id="drop"><b>Select or drop an .apk</b><p>Quest 3 / 3S &middot; nothing is uploaded, all local</p>
<input type="file" id="f" accept=".apk,.zip,.xapk"></label>
<div id="msg"></div>
<div id="out" hidden>
<div class="grid" id="info"></div>
<div class="bar" id="chips"></div>
<div class="bar"><button class="p" id="all">Snatch all shown</button></div>
<div id="list"></div>
</div></main>
<script>
const $=s=>document.querySelector(s),msg=(t,e)=>{$('#msg').textContent=t;$('#msg').className=e?'err':''};
let file,entries=[],filt='all';
const u16=(d,o)=>d.getUint16(o,true),u32=(d,o)=>d.getUint32(o,true);
async function rd(a,b){return new DataView(await file.slice(a,b).arrayBuffer())}
async function parseZip(){
  const tail=Math.min(file.size,66000),t=await rd(file.size-tail,file.size);
  let e=-1;for(let i=tail-22;i>=0;i--)if(u32(t,i)===0x06054b50){e=i;break}
  if(e<0)throw Error('Not a valid APK/ZIP file');
  const n=u16(t,e+10),sz=u32(t,e+12),off=u32(t,e+16);
  if(off===0xFFFFFFFF||n===0xFFFF)throw Error('ZIP64 archives (4GB+) are not supported yet');
  const cd=await rd(off,off+sz),dec=new TextDecoder();let p=0,out=[];
  for(let i=0;i<n;i++){
    const nl=u16(cd,p+28),el=u16(cd,p+30),cl=u16(cd,p+32);
    out.push({m:u16(cd,p+10),cs:u32(cd,p+20),us:u32(cd,p+24),lo:u32(cd,p+42),name:dec.decode(new Uint8Array(cd.buffer,p+46,nl))});
    p+=46+nl+el+cl;
  }return out;
}
async function data(en,max){
  const h=await rd(en.lo,en.lo+30),s=en.lo+30+u16(h,26)+u16(h,28);
  let blob=file.slice(s,s+en.cs);
  if(en.m===8){
    const st=blob.stream().pipeThrough(new DecompressionStream('deflate-raw'));
    if(!max)return new Blob([await new Response(st).arrayBuffer()]);
    const r=st.getReader();let got=[],len=0;
    while(len<max){const{value,done}=await r.read();if(done)break;got.push(value);len+=value.length}
    r.cancel();return new Blob(got);
  }return max?blob.slice(0,max):blob;
}
function axml(buf){
  const d=new DataView(buf),sp=8,hs=u16(d,sp+2),cnt=u32(d,sp+8),fl=u32(d,sp+16),ss=u32(d,sp+20),csz=u32(d,sp+4);
  const str=[];
  for(let i=0;i<cnt;i++){
    let o=sp+ss+u32(d,sp+hs+i*4),s='';
    if(fl&256){let l=d.getUint8(o);o+=l&128?2:1;let b=d.getUint8(o);o+=b&128?2:1;
      s=new TextDecoder().decode(new Uint8Array(buf,o,l))}
    else{let l=u16(d,o);o+=2;if(l&0x8000){l=((l&0x7fff)<<16)|u16(d,o);o+=2}
      for(let k=0;k<l;k++)s+=String.fromCharCode(u16(d,o+k*2))}
    str.push(s);
  }
  const r={};let p=sp+csz;
  while(p<buf.byteLength){
    const t=u16(d,p),z=u32(d,p+4);
    if(t===0x0102&&str[u32(d,p+20)]==='manifest'){
      const as=u16(d,p+24),ac=u16(d,p+28);
      for(let i=0;i<ac;i++){const a=p+16+as+i*20,nm=str[u32(d,a+4)],rv=u32(d,a+8)|0;
        r[nm]=rv>=0?str[rv]:u32(d,a+16)}
      break}
    p+=z;
  }return r;
}
const fmt=b=>b>1e6?(b/1e6).toFixed(1)+' MB':(b/1e3).toFixed(0)+' KB';
async function unityVer(){
  for(const nm of['assets/bin/Data/globalgamemanagers','assets/bin/Data/data.unity3d','assets/bin/Data/unity default resources']){
    const en=entries.find(e=>e.name===nm);if(!en)continue;
    const txt=await (await data(en,8192)).text().catch(()=>'');
    const b=new Uint8Array(await (await data(en,8192)).arrayBuffer());
    let s='';for(const c of b)s+=c>31&&c<127?String.fromCharCode(c):' ';
    const m=s.match(/\b(\d{1,4}\.\d+\.\d+[fpab]\d+)\b/);if(m)return m[1];
  }return 'Not found';
}
function card(l,v,h){return`<div class="c ${h?'hl':''}"><small>${l}</small><span>${v}</span></div>`}
function render(){
  const ok=e=>/\.(so|dll)$/i.test(e.name)||/global-metadata\.dat$/i.test(e.name);
  const show=entries.filter(e=>ok(e)&&(filt==='all'||e.name.toLowerCase().endsWith(filt)||(filt==='.dat'&&/\.dat$/i.test(e.name))));
  window.shown=show;
  $('#list').innerHTML=show.map((e,i)=>{const x=e.name.split('.').pop().toLowerCase();
    return`<div class="row"><span class="tag ${x==='so'?'':'d'}">.${x}</span><span class="n">${e.name}</span><span class="s">${fmt(e.us)}</span><button data-i="${i}">Snatch</button></div>`}).join('')||'<p class="sub">Nothing matching.</p>';
  $('#chips').innerHTML=['all','.so','.dll','.dat'].map(c=>`<button class="chip ${c===filt?'on':''}" data-c="${c}">${c==='all'?'All':c}</button>`).join('');
}
const DONE=window.Snatcher?'Saved to Downloads/VersionSnatcher':'Done.';
function b64(u){let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)}
async function save(e){
  const b=await data(e);
  if(window.Snatcher){
    const nm=e.name.replace(/^lib\//,'').replace(/\//g,'_');
    if(!Snatcher.open(nm))throw Error('Could not create file in Downloads');
    for(let o=0;o<b.size;o+=786432){
      const ab=await b.slice(o,o+786432).arrayBuffer();
      if(!Snatcher.write(b64(new Uint8Array(ab)))){Snatcher.close();throw Error('Write failed')}
    }
    Snatcher.close();return;
  }
  const a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download=e.name.split('/').pop();document.body.appendChild(a);a.click();a.remove();
}
$('#list').onclick=async ev=>{const i=ev.target.dataset.i;if(i==null)return;
  msg('Extracting '+shown[i].name.split('/').pop()+'...');try{await save(shown[i]);msg(DONE)}catch(x){msg(x.message,1)}};
$('#chips').onclick=ev=>{if(ev.target.dataset.c){filt=ev.target.dataset.c;render()}};
$('#all').onclick=async()=>{for(const e of shown){msg('Extracting '+e.name.split('/').pop()+'...');try{await save(e)}catch(x){msg(x.message,1);return}await new Promise(r=>setTimeout(r,350))}msg(DONE)};
async function load(f){
  file=f;$('#out').hidden=true;msg('Reading '+f.name+'...');
  try{
    entries=await parseZip();
    let man={};const me=entries.find(e=>e.name==='AndroidManifest.xml');
    if(me)try{man=axml(await (await data(me)).arrayBuffer())}catch(x){}
    const uv=await unityVer(),il=entries.some(e=>/libil2cpp\.so$/.test(e.name)),mono=entries.some(e=>/Assembly-CSharp\.dll$/.test(e.name));
    const archs=[...new Set(entries.filter(e=>/^lib\/[^/]+\/.+\.so$/.test(e.name)).map(e=>e.name.split('/')[1]))];
    $('#info').innerHTML=card('Unity editor version',uv,1)+card('Package',man.package||'?')+card('App version',(man.versionName||'?')+(man.versionCode!=null?' ('+man.versionCode+')':''))+card('Backend',il?'IL2CPP':mono?'Mono':'Unknown')+card('Architectures',archs.join(', ')||'none')+card('Total files',entries.length);
    filt='all';render();$('#out').hidden=false;msg('');
  }catch(x){msg(x.message,1)}
}
$('#f').onchange=e=>e.target.files[0]&&load(e.target.files[0]);
const dz=$('#drop');
dz.ondragover=e=>{e.preventDefault();dz.classList.add('on')};dz.ondragleave=()=>dz.classList.remove('on');
dz.ondrop=e=>{e.preventDefault();dz.classList.remove('on');e.dataTransfer.files[0]&&load(e.dataTransfer.files[0])};
</script></body></html>
